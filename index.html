<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eternal Sunshine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161022'/%3E%3Ccircle cx='32' cy='36' r='15' fill='%23FFC66E'/%3E%3C/svg%3E" />
<!-- PWA install support: manifest + icons + theme color. Same minimal pattern
     used across this app ecosystem (Adulting, Businessing) so install behavior
     and branding stay consistent app to app. -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#FFC66E">
<style>
  :root{
    --night:#161022; --dusk:#1e1732; --surface:#271d3d; --surface-2:#2f2447;
    --line:rgba(255,255,255,.10); --ink:#F6EEE2; --muted:#B6A7C4; --faint:#8B7DA0;
    --gold:#FFC66E; --gold-hi:#FFD98A; --amber:#FF9E64; --coral:#FF7D6B; --mint:#7FD9A6; --lav:#B79CFF;
    --track:rgba(255,255,255,.08); --radius:16px;
    --danger:#FF7D6B; --ok:#7FD9A6;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--night); color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh}

  /* ---- living background sky (driven by progress) ---- */
  #ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #ambient .sky{position:absolute;inset:0;transition:opacity .6s ease}
  #ambient .sky-night{background:linear-gradient(180deg,#140f24 0%,#241634 42%,#5b2f4e 74%,#7a3f40 100%)}
  #ambient .sky-day{background:linear-gradient(180deg,#6ea3d6 0%,#a9c6e0 38%,#ffd98a 76%,#ffe9c4 100%);opacity:0}
  #ambient .stars{position:absolute;inset:0;transition:opacity .6s ease;background-image:
    radial-gradient(1.4px 1.4px at 12% 16%,rgba(255,255,255,.9),transparent),
    radial-gradient(1.2px 1.2px at 26% 30%,rgba(255,246,230,.7),transparent),
    radial-gradient(1px 1px at 44% 12%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.5px 1.5px at 60% 22%,rgba(255,255,255,.85),transparent),
    radial-gradient(1px 1px at 74% 10%,rgba(230,220,255,.6),transparent),
    radial-gradient(1.3px 1.3px at 86% 24%,rgba(255,255,255,.8),transparent),
    radial-gradient(1px 1px at 20% 46%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.1px 1.1px at 68% 40%,rgba(255,255,255,.5),transparent)}
  #ambient .glow-sun{position:absolute;left:6%;bottom:-32%;width:74vw;height:74vw;border-radius:50%;transition:opacity .6s ease;
    background:radial-gradient(circle,rgba(255,168,110,.30),rgba(255,120,80,.10) 38%,transparent 60%);filter:blur(6px)}
  #ambient .moon{position:absolute;right:8%;top:6%;width:88px;height:88px;border-radius:50%;transition:opacity .6s ease;
    background:radial-gradient(circle at 38% 36%,#fdf5e8,#efe0cf 48%,#cdbcd8 78%,#b3a2c8 100%);
    box-shadow:0 0 60px 20px rgba(240,225,205,.16),inset -12px -9px 22px rgba(110,88,140,.55)}
  #ambient .moon i{position:absolute;border-radius:50%;background:rgba(150,128,170,.3)}
  #ambient .moon i:nth-child(1){width:15px;height:15px;top:20px;left:22px}
  #ambient .moon i:nth-child(2){width:9px;height:9px;top:46px;left:50px}
  #ambient .moon i:nth-child(3){width:7px;height:7px;top:28px;left:56px}
  #ambient .sun-core{position:absolute;left:50%;top:66%;width:70px;height:70px;border-radius:50%;opacity:0;transition:opacity .6s ease, top .6s ease;
    background:radial-gradient(circle at 50% 45%,#fffef8,#ffe6a0 46%,#ffb85e 74%,transparent 80%);
    box-shadow:0 0 60px 22px rgba(255,205,120,.4);transform:translate(-50%,0)}
  /* legibility veil so text stays readable as the sky brightens */
  #veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,10,24,.34),rgba(14,10,24,.56))}

  /* ---- layout ---- */
  .wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:26px 18px 96px}
  .apphead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
  .apphead .greet{font-size:13px;color:var(--muted)}
  .apphead h1{font-size:25px;font-weight:650;letter-spacing:-.4px;margin:2px 0 0}
  .apphead h1 .s{color:var(--gold)}
  .muted{color:var(--muted)} .hint{color:var(--faint);font-size:12px}
  .row{display:flex;gap:8px;align-items:center} .row.between{justify-content:space-between}
  .hr{height:1px;background:var(--line);margin:14px 0}
  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);margin:22px 4px 8px}

  .card{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);
    border-radius:var(--radius);padding:15px;margin-bottom:12px;position:relative;overflow:hidden}
  .card.tap{cursor:pointer;transition:transform .12s ease,border-color .12s ease}
  .card.tap:active{transform:scale(.99)} .card.tap:hover{border-color:rgba(255,198,110,.35)}

  .goal-name{font-size:16px;font-weight:620;letter-spacing:-.2px}
  .goal-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .chip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:100px;white-space:nowrap}
  .chip.behind{background:rgba(255,125,107,.16);color:var(--coral)}
  .chip.pace{background:rgba(127,217,166,.16);color:var(--mint)}
  .chip.est{background:rgba(183,156,255,.15);color:var(--lav)}
  .chip.done{background:rgba(127,217,166,.18);color:var(--mint)}

  /* horizontal progress band: sun at progress, optional time marker */
  .horizon{position:relative;height:64px;margin:14px 0 4px;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,#241a3a,#3d2550 45%,#7a3f5a 78%,#c9714f 100%)}
  .horizon.big{height:104px}
  .horizon .hstars{position:absolute;inset:0;background-image:
    radial-gradient(1px 1px at 22% 30%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 62% 20%,rgba(255,255,255,.4),transparent),
    radial-gradient(1px 1px at 82% 40%,rgba(255,255,255,.35),transparent)}
  .horizon .hsun{position:absolute;bottom:9px;width:26px;height:26px;border-radius:50%;transform:translateX(-50%);
    background:radial-gradient(circle at 50% 40%,var(--gold-hi),var(--amber));box-shadow:0 0 18px 5px rgba(255,180,90,.55)}
  .horizon.big .hsun{width:34px;height:34px}
  .horizon .hground{position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(180deg,rgba(20,12,26,.2),rgba(10,6,16,.85))}
  .horizon .hmark{position:absolute;top:5px;bottom:5px;width:2px;border-radius:2px;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.75) 0 4px,transparent 4px 8px)}
  .horizon .hmark::after{content:"now";position:absolute;top:-1px;left:5px;font-size:8.5px;color:rgba(255,255,255,.85);font-weight:700}

  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .big-num{font-size:14.5px;font-weight:650} .big-num small{font-size:12px;color:var(--muted);font-weight:500}
  .week-move{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .week-move b{color:var(--ink);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 8px var(--amber)}

  /* stage / milestone meters */
  .stage{margin-top:12px}
  .stage-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:6px}
  .stage-name{font-weight:600;color:var(--ink)} .stage-name .w{color:var(--faint);font-weight:500;font-size:11px;margin-left:5px}
  .stage-val{color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:9px;border-radius:100px;background:var(--track);overflow:hidden;position:relative}
  .bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:100px;background:linear-gradient(90deg,var(--amber),var(--gold-hi))}
  .stage.wall .stage-name{color:var(--coral)} .stage.wall .stage-val{color:var(--coral)}
  .stage.wall .bar>span{background:linear-gradient(90deg,#c0503f,var(--coral))}

  /* action rows */
  .action{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .action:last-child{border-bottom:0}
  .check{width:22px;height:22px;border-radius:7px;border:2px solid var(--faint);flex:none;margin-top:1px;cursor:pointer;position:relative;background:none}
  .check.on{background:var(--gold);border-color:var(--gold)}
  .check.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#3a2410;font-size:13px;font-weight:900}
  .a-txt{font-size:13.5px;line-height:1.4;flex:1}
  .a-txt.done{color:var(--faint);text-decoration:line-through}
  .a-txt small{display:block;color:var(--faint);font-size:11px;margin-top:2px;text-decoration:none}
  .a-tools{display:flex;gap:6px;align-items:center}

  /* gates */
  .gate{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--line)}
  .gate:last-child{border-bottom:0}
  .gate .g-ic{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;cursor:pointer}
  .gate.done .g-ic{background:rgba(127,217,166,.2);color:var(--mint)}
  .gate.wip .g-ic{background:rgba(255,198,110,.18);color:var(--gold)}
  .gate.no .g-ic{background:rgba(255,125,107,.16);color:var(--coral)}
  .gate .g-txt{color:var(--ink)}

  /* buttons / fields (shared plumbing classes, dark themed) */
  .btn-primary{background:linear-gradient(90deg,var(--amber),var(--gold-hi));color:#3a2410;border:none;padding:10px 16px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer}
  .btn-sm{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);padding:7px 12px;border-radius:10px;font-size:13px;cursor:pointer}
  .btn-ghost{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
  .btn-gold{background:rgba(255,198,110,.16);border:1px solid transparent;color:var(--gold-hi);padding:7px 12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:rgba(0,0,0,.22);color:var(--ink)}
  .status-pill{font-size:12px;padding:2px 10px;border-radius:999px}
  .status-pill.done{background:rgba(127,217,166,.18);color:var(--mint)} .status-pill.none{background:rgba(255,255,255,.07);color:var(--muted)}

  /* modal / toast */
  .modal-backdrop{position:fixed;inset:0;background:rgba(8,5,16,.62);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
  .modal{background:var(--dusk);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto}
  .modal h3{margin:0 0 14px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #toastRoot{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:90}
  .toast{background:#0f0a1c;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:11px;font-size:13.5px;box-shadow:0 8px 22px rgba(0,0,0,.5)}

  /* bottom nav */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;
    padding:9px 0 14px;background:rgba(15,10,28,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .tabbar button{background:none;border:none;color:var(--faint);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:2px 14px}
  .tabbar button .ic{font-size:19px;line-height:1}
  .tabbar button.on{color:var(--gold)}

  /* assistant (Blue Bonnet) */
  .as-bubble{position:fixed;right:18px;bottom:78px;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;z-index:70;
    background:radial-gradient(circle at 40% 35%,#d7c6ff,var(--lav));color:#241436;font-size:22px;box-shadow:0 6px 18px rgba(120,90,180,.5);display:flex;align-items:center;justify-content:center}
  .as-panel{position:fixed;right:18px;bottom:140px;width:340px;max-width:calc(100vw - 36px);height:460px;max-height:calc(100vh - 170px);
    background:var(--dusk);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:70;display:none;flex-direction:column;overflow:hidden}
  .as-panel.open{display:flex}
  .as-header{background:linear-gradient(90deg,#6a4fa0,var(--lav));color:#fff;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .as-header button{background:none;border:none;color:#fff;font-size:16px;cursor:pointer}
  .as-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .as-row{display:flex} .as-row.as-user{justify-content:flex-end}
  .as-text{max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap}
  .as-row.as-user .as-text{background:var(--amber);color:#3a2410;border-bottom-right-radius:3px}
  .as-row.as-assistant .as-text{background:var(--surface-2);color:var(--ink);border-bottom-left-radius:3px}
  .as-action-note{margin-top:6px;font-size:11px;color:var(--mint)}
  .as-input-row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
  .as-input-row input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:rgba(0,0,0,.22);color:var(--ink)}
  .as-input-row button{background:var(--lav);color:#241436;border:none;border-radius:9px;padding:0 14px;cursor:pointer;font-size:13px;font-weight:700}

  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
</style>
</head>
<body>
<div id="ambient">
  <div class="sky sky-night"></div><div class="sky sky-day"></div>
  <div class="stars"></div>
  <div class="glow-sun"></div>
  <div class="moon"><i></i><i></i><i></i></div>
  <div class="sun-core"></div>
</div>
<div id="veil"></div>

<div class="wrap" id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="asRoot"></div>

<script>
"use strict";

/* ===========================================================================
   1. APP CONFIG — sibling of Adulting & Businessing on the same origin.
   =========================================================================== */
const APP = {
  name: "Eternal Sunshine",
  storageKey: "eternal-sunshine-v1",
  driveFileName: "eternal-sunshine-state.json",
  tokenSessionKey: "eternalsunshine-gcal-token",
  assistantName: "Blue Bonnet",
  assistantEmoji: "☀️",
  siblingStorageKeys: ["adulting-state-v1", "businessing-state-v1"], // inherit Google/Worker settings
};
const ADULTING_KEY = "adulting-state-v1"; // where promoted weekly moves land

/* ===========================================================================
   2. STATE
   =========================================================================== */
function defaultState() {
  return {
    goals: [],
    updatedAt: Date.now(),
    settings: {
      googleClientId: "", defaultCalendarId: "primary",
      assistantProxyUrl: "",
      assistantCheckins: false, assistantCheckinHours: 3, lastAssistantCheckinAt: null,
      notificationsEnabled: false,
    },
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(APP.storageKey);
    if (!raw) { const s = defaultState(); inheritSiblingSettings(s); return s; }
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed);
    merged.settings = Object.assign(defaultState().settings, parsed.settings || {});
    merged.goals = Array.isArray(parsed.goals) ? parsed.goals : [];
    if (!merged.updatedAt) merged.updatedAt = Date.now();
    inheritSiblingSettings(merged);
    return merged;
  } catch (e) { console.error("Failed to load state, starting fresh.", e); const s = defaultState(); inheritSiblingSettings(s); return s; }
}
function inheritSiblingSettings(state) {
  for (const key of APP.siblingStorageKeys || []) {
    try {
      const raw = localStorage.getItem(key); if (!raw) continue;
      const s = (JSON.parse(raw) || {}).settings || {};
      const proxy = s.assistantProxyUrl || s.blueBonnetProxyUrl;
      if (!state.settings.assistantProxyUrl && proxy) state.settings.assistantProxyUrl = proxy;
      if (!state.settings.googleClientId && s.googleClientId) state.settings.googleClientId = s.googleClientId;
    } catch (e) {}
  }
}
function saveState() { localStorage.setItem(APP.storageKey, JSON.stringify(STATE)); }

let STATE = loadState();
let VIEW = { name: "horizon", goalId: null }; // not persisted
let driveSyncTimer = null;

function persist() { STATE.updatedAt = Date.now(); saveState(); render(); scheduleDrivePush(); }
function scheduleDrivePush() {
  clearTimeout(driveSyncTimer);
  driveSyncTimer = setTimeout(() => {
    if (typeof DriveSync !== "undefined" && DriveSync.available()) DriveSync.push(STATE).catch((e) => console.warn("Drive push failed:", e));
  }, 1500);
}

/* ===========================================================================
   3. HELPERS
   =========================================================================== */
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function clamp(x) { return Math.max(0, Math.min(1, x)); }
function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function addDaysISO(iso, days) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString(undefined, { month: "short", year: "numeric" }); }
function humanMonths(days) {
  if (days == null) return "";
  const m = days / 30.4;
  if (m < 1.5) return "~" + Math.max(1, Math.round(days / 7)) + " weeks";
  if (m < 22) return "~" + Math.round(m) + " months";
  return "~" + (Math.round(m / 6) / 2) + " years";
}
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toast(msg) { const r = document.getElementById("toastRoot"); r.innerHTML = '<div class="toast">' + escapeHtml(msg) + "</div>"; clearTimeout(toast._t); toast._t = setTimeout(() => (r.innerHTML = ""), 3200); }
function openModal(html) { document.getElementById("modalRoot").innerHTML = '<div class="modal-backdrop" data-action="close-modal-backdrop"><div class="modal">' + html + "</div></div>"; }
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }

/* ===========================================================================
   4. GOAL COMPUTATION
   =========================================================================== */
function goalProgress(g) {
  if (!g.milestones || !g.milestones.length) return 0;
  let tw = 0, acc = 0;
  g.milestones.forEach((m) => {
    const w = (typeof m.weight === "number" && m.weight > 0) ? m.weight : 1;
    const total = (m.actions || []).length;
    const done = (m.actions || []).filter((a) => a.done).length;
    tw += w; acc += w * (total ? done / total : 0);
  });
  return tw ? acc / tw : 0;
}
function milestoneProgress(m) { const t = (m.actions || []).length; return t ? (m.actions.filter((a) => a.done).length) / t : 0; }
function weakestMilestone(g) {
  let worst = null, wp = 2;
  (g.milestones || []).forEach((m) => { const p = milestoneProgress(m); if (p < wp) { wp = p; worst = m; } });
  return worst;
}
function timeElapsed(g) {
  if (g.type !== "date" || !g.startDate || !g.targetDate) return null;
  const total = daysBetween(g.startDate, g.targetDate); if (total <= 0) return 1;
  return clamp(daysBetween(g.startDate, todayISO()) / total);
}
function projected(g) {
  const p = goalProgress(g);
  if (p >= 1) return { done: true };
  if (p <= 0) return { stalled: true };
  const createdISO = new Date(g.createdAt || Date.now()).toISOString().slice(0, 10);
  const days = daysBetween(createdISO, todayISO());
  if (days < 14) return { early: true }; // not enough velocity history yet to project honestly
  const rate = p / days; if (rate <= 0) return { stalled: true };
  const remaining = (1 - p) / rate;
  return { stalled: false, days: remaining, dateISO: addDaysISO(todayISO(), Math.round(remaining)) };
}
function thisWeekMoves(g) {
  const out = [];
  (g.milestones || []).forEach((m) => (m.actions || []).forEach((a) => { if (!a.done) out.push({ m, a }); }));
  return out;
}

/* ===========================================================================
   5. LIVING SKY (background follows the progress being viewed)
   =========================================================================== */
function setSky(p) {
  p = clamp(p);
  const q = (s) => document.querySelector(s);
  const day = q("#ambient .sky-day"), stars = q("#ambient .stars"), moon = q("#ambient .moon"),
        glow = q("#ambient .glow-sun"), sun = q("#ambient .sun-core");
  if (!day) return;
  day.style.opacity = 0.85 * p;
  stars.style.opacity = 0.8 * clamp(1 - p / 0.45);
  moon.style.opacity = clamp(1 - p / 0.72);
  glow.style.opacity = 0.4 + 0.5 * p;
  sun.style.opacity = clamp((p - 0.22) / 0.78);

   =========================================================================== */
const DriveSync = (function () {
  const API_BASE = "https://www.googleapis.com/drive/v3", UPLOAD_BASE = "https://www.googleapis.com/upload/drive/v3";
  let cachedFileId = null;
  function available() { return Calendar.getAccessToken ? !!Calendar.getAccessToken() : false; }
  function authHeaders() { const t = Calendar.getAccessToken(); if (!t) throw new Error("Not signed in to Google."); return { Authorization: "Bearer " + t }; }
  async function findFileId() {
    if (cachedFileId) return cachedFileId;
    const params = new URLSearchParams({ spaces: "appDataFolder", q: "name='" + APP.driveFileName + "'", fields: "files(id, modifiedTime)", pageSize: "1" });
    const res = await fetch(API_BASE + "/files?" + params.toString(), { headers: authHeaders() });
    if (!res.ok) throw new Error("Drive lookup failed: " + res.status);
    const file = ((await res.json()).files || [])[0]; cachedFileId = file ? file.id : null; return cachedFileId;
  }
  async function pull() { if (!available()) return null; const id = await findFileId(); if (!id) return null; const res = await fetch(API_BASE + "/files/" + id + "?alt=media", { headers: authHeaders() }); if (!res.ok) throw new Error("Drive read failed: " + res.status); try { return await res.json(); } catch (e) { return null; } }
  async function push(state) {
    if (!available()) return false;

    if (id) { const res = await fetch(UPLOAD_BASE + "/files/" + id + "?uploadType=media", { method: "PATCH", headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()), body }); if (!res.ok) throw new Error("Drive save failed: " + res.status); return true; }

    const multipartBody = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + metadata + "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + body + "\r\n--" + boundary + "--";
    const res = await fetch(UPLOAD_BASE + "/files?uploadType=multipart", { method: "POST", headers: Object.assign({ "Content-Type": "multipart/related; boundary=" + boundary }, authHeaders()), body: multipartBody });
    if (!res.ok) throw new Error("Drive create failed: " + res.status); cachedFileId = (await res.json()).id; return true;
  }

})();

    const remote = await DriveSync.pull();

  const p = goalProgress(g);
  if (p >= 1) return '<span class="chip done">Complete ☀</span>';
  if (g.type === "date") { const te = timeElapsed(g); if (te == null) return '<span class="chip est">Est</span>'; const drift = p - te; return drift >= -0.02 ? '<span class="chip pace">On pace</span>' : '<span class="chip behind">Behind pace</span>'; }
  return '<span class="chip est">Est</span>';
}
function goalMetaLine(g) {
  const p = goalProgress(g);
  if (g.type === "date") {
    const d = g.targetDate ? daysBetween(todayISO(), g.targetDate) : null;
    return fmtDate(g.targetDate) + (d != null ? " · in " + humanMonths(d) : "");
  }
  const pr = projected(g);
  if (pr.done) return "Ready now";
  if (pr.early) return "Projection building…";
  if (pr.stalled) return "Stalled — no projected date yet";
  return "Projected " + humanMonths(pr.days);
}

function renderHorizon() {
  const gs = STATE.goals || [];
  let html =
    '<div class="apphead"><div><div class="greet">' + new Date().toLocaleDateString(undefined, { weekday: "long" }) + ' morning, Dusty</div><h1>The <span class="s">Horizon</span></h1></div>' +
    '<button class="btn-sm" data-action="open-settings">⚙</button></div>';
  if (!gs.length) html += '<div class="empty">No goals yet.<br>Add the first thing worth working toward.</div>';
  gs.forEach((g) => {
    const p = goalProgress(g); const move = thisWeekMoves(g)[0];
    html +=
      '<div class="card tap" data-action="open-goal" data-id="' + g.id + '">' +
      '<div class="row between"><div><div class="goal-name">' + escapeHtml(g.name) + '</div><div class="goal-sub">' + goalMetaLine(g) + '</div></div>' + goalStatusChip(g) + "</div>" +
      skyBand(g, false) +
      '<div class="meta-row"><div class="big-num">' + Math.round(p * 100) + '% <small>' + (g.type === "date" ? "of the path done" : "of the load lifted") + '</small></div>' +
        (g.type === "condition" ? (function () { const w = weakestMilestone(g); return w && milestoneProgress(w) < 1 ? '<div class="big-num" style="color:var(--coral)">' + escapeHtml(w.name) + ' <small>is the wall</small></div>' : ""; })()
          : (function () { const te = timeElapsed(g); if (te == null) return ""; const dr = Math.round((p - te) * 100); return '<div class="big-num" style="color:' + (dr >= 0 ? "var(--mint)" : "var(--coral)") + '">' + (dr >= 0 ? "+" : "") + dr + '% <small>vs time</small></div>'; })()) +
      "</div>" +
      (move ? '<div class="week-move"><span class="dot"></span><span><b>This week:</b> ' + escapeHtml(move.a.text) + "</span></div>" : "") +
      "</div>";
  });
  html += '<button class="btn-primary" style="width:100%;margin-top:6px" data-action="add-goal">+ New goal</button>';
  document.getElementById("app").innerHTML = html;
  setSky(overallProgress());
}

function renderGoalDetail(g) {
  const p = goalProgress(g);
  let html =
    '<div class="apphead"><div><button class="btn-ghost" data-action="go-horizon" style="padding:0;margin-bottom:4px">‹ Horizon</button>' +
    '<h1 style="font-size:21px">' + escapeHtml(g.name) + "</h1>" +
    '<div class="greet">' + (g.type === "date" ? "Date-anchored · " + goalMetaLine(g) : "Condition-anchored · " + goalMetaLine(g)) + "</div></div>" +
    goalStatusChip(g) + "</div>" +
    skyBand(g, true) +
    '<div class="meta-row"><div class="big-num" style="font-size:22px">' + Math.round(p * 100) + '% <small>' + (g.type === "date" ? "of the path done" : "of the load lifted") + "</small></div></div>";

  html += '<div class="section-title">' + (g.type === "condition" ? "Stages · weakest link governs" : "Milestones") + "</div>";
  const worst = weakestMilestone(g);
  (g.milestones || []).forEach((m) => {
    const mp = milestoneProgress(m); const isWall = g.type === "condition" && worst && m.id === worst.id && mp < 1;
    html += '<div class="stage' + (isWall ? " wall" : "") + '"><div class="stage-row"><span class="stage-name">' + escapeHtml(m.name) + (g.type === "condition" ? '<span class="w">·' + (m.weight || 1) + "%</span>" : "") + '</span><span class="stage-val">' + Math.round(mp * 100) + "%</span></div><div class=\"bar\"><span style=\"width:" + Math.round(mp * 100) + '%"></span></div>';
    (m.actions || []).forEach((a) => {
      html += '<div class="action"><button class="check' + (a.done ? " on" : "") + '" data-action="toggle-action" data-gid="' + g.id + '" data-mid="' + m.id + '" data-aid="' + a.id + '"></button>' +
        '<div class="a-txt' + (a.done ? " done" : "") + '">' + escapeHtml(a.text) + "</div>" +
        '<div class="a-tools">' + (a.done ? "" : '<button class="btn-sm" data-action="send-move" data-gid="' + g.id + '" data-aid="' + a.id + '" title="Send to Adulting as a daily task">→ Adulting</button>') + "</div></div>";
    });
    html += '<div style="margin-top:8px"><button class="btn-ghost" style="font-size:12.5px" data-action="add-action" data-gid="' + g.id + '" data-mid="' + m.id + '">+ action</button></div></div>';
  });
  html += '<div style="margin-top:12px"><button class="btn-sm" data-action="add-milestone" data-gid="' + g.id + '">+ ' + (g.type === "condition" ? "stage" : "milestone") + "</button></div>";

  if (g.type === "condition" && (g.gates || []).length) {
    html += '<div class="section-title">What still ties you here</div>';
    g.gates.forEach((gt) => {
      const ic = gt.status === "done" ? "✓" : gt.status === "wip" ? "◐" : "○";
      html += '<div class="gate ' + gt.status + '"><button class="g-ic" data-action="cycle-gate" data-gid="' + g.id + '" data-gtid="' + gt.id + '">' + ic + '</button><span class="g-txt">' + escapeHtml(gt.text) + "</span></div>";
    });
  }
  document.getElementById("app").innerHTML = html;
  setSky(p);
}

function renderCheck() {
  let html = '<div class="apphead"><div><div class="greet">Sunday ritual</div><h1>Horizon <span class="s">Check</span></h1></div><button class="btn-sm" data-action="open-settings">⚙</button></div>';
  html += '<p class="hint" style="margin:0 0 8px 4px">Pick the one thing that matters per goal. Sending drops it into Adulting as a real daily task.</p>';
  let any = false;
  (STATE.goals || []).forEach((g) => {
    const moves = thisWeekMoves(g).slice(0, 3); if (!moves.length) return; any = true;
    html += '<div class="section-title" style="display:flex;gap:8px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block"></span>' + escapeHtml(g.name) + "</div>";
    moves.forEach((mv) => {
      html += '<div class="card" style="margin-bottom:8px"><div class="action" style="border:0;padding:0">' +
        '<button class="check" data-action="send-move" data-gid="' + g.id + '" data-aid="' + mv.a.id + '"></button>' +
        '<div class="a-txt">' + escapeHtml(mv.a.text) + '<small>' + escapeHtml(mv.m.name) + '</small></div></div></div>';
    });
  });
  if (!any) html += '<div class="empty">Nothing outstanding this week. Enjoy the sunshine.</div>';
  document.getElementById("app").innerHTML = html;
  setSky(overallProgress());
}

function renderTabbar() {
  const t = VIEW.name;
  const bar = '<div class="tabbar">' +
    '<button class="' + (t === "horizon" || t === "goal" ? "on" : "") + '" data-action="go-horizon"><span class="ic">☀</span>Horizon</button>' +
    '<button class="' + (t === "check" ? "on" : "") + '" data-action="go-check"><span class="ic">✓</span>Weekly</button>' +
    '<button data-action="open-settings"><span class="ic">⚙</span>Settings</button></div>';
  let el = document.getElementById("tabbar");
  if (!el) { el = document.createElement("div"); el.id = "tabbar"; document.body.appendChild(el); }
  el.innerHTML = bar;
}

function render() {
  seedIfEmpty();
  if (VIEW.name === "goal") { const g = STATE.goals.find((x) => x.id === VIEW.goalId); if (!g) { VIEW = { name: "horizon" }; } else { renderGoalDetail(g); renderTabbar(); return; } }
  if (VIEW.name === "check") renderCheck();
  else renderHorizon();
  renderTabbar();
}

/* ===========================================================================
   14. MODALS
   =========================================================================== */
function openAddGoalModal() {
  openModal(
    "<h3>New goal</h3><form data-form=\"add-goal\">" +
    '<div class="field"><label>What are you working toward?</label><input type="text" name="name" required autofocus placeholder="e.g. Spain, step back from ADV Media" /></div>' +
    '<div class="field"><label>Kind of goal</label><select name="type"><option value="date">Has a date (countdown)</option><option value="condition">Happens when it\'s ready (condition)</option></select></div>' +
    '<div class="field" id="dateField"><label>Target date</label><input type="date" name="targetDate" /></div>' +
    '<div class="modal-actions"><button type="button" class="btn-ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn-primary">Add goal</button></div></form>'
  );
  const form = document.querySelector('[data-form="add-goal"]');
  form.querySelector('[name="type"]').addEventListener("change", (e) => { document.getElementById("dateField").style.display = e.target.value === "date" ? "" : "none"; });
  form.addEventListener("submit", (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries());
    const g = newGoal(d.name.trim(), d.type);
    if (d.type === "date") { g.startDate = todayISO(); g.targetDate = d.targetDate || addDaysISO(todayISO(), 180); }
    g.milestones = [{ id: uid(), name: d.type === "condition" ? "Stage 1" : "Milestone 1", weight: d.type === "condition" ? 100 : 1, actions: [] }];
    STATE.goals.push(g); VIEW = { name: "goal", goalId: g.id }; persist(); closeModal();
  });
}
function openAddActionModal(gid, mid) {
  openModal("<h3>Add action</h3><form data-form=\"add-action\"><div class=\"field\"><label>What's the move?</label><input type=\"text\" name=\"text\" required autofocus placeholder=\"a concrete weekly step\" /></div><div class=\"modal-actions\"><button type=\"button\" class=\"btn-ghost\" data-action=\"close-modal\">Cancel</button><button type=\"submit\" class=\"btn-primary\">Add</button></div></form>");
  document.querySelector('[data-form="add-action"]').addEventListener("submit", (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries());
    const g = STATE.goals.find((x) => x.id === gid); const m = g && g.milestones.find((x) => x.id === mid); if (!m) return;
    m.actions.push({ id: uid(), text: d.text.trim(), done: false }); persist(); closeModal();
  });
}
function openAddMilestoneModal(gid) {
  const g = STATE.goals.find((x) => x.id === gid); if (!g) return; const cond = g.type === "condition";
  openModal("<h3>Add " + (cond ? "stage" : "milestone") + "</h3><form data-form=\"add-ms\"><div class=\"field\"><label>Name</label><input type=\"text\" name=\"name\" required autofocus /></div>" + (cond ? '<div class="field"><label>Weight (% of your load)</label><input type="number" name="weight" min="1" max="100" value="10" /></div>' : "") + '<div class="modal-actions"><button type="button" class="btn-ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn-primary">Add</button></div></form>');
  document.querySelector('[data-form="add-ms"]').addEventListener("submit", (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries());
    g.milestones.push({ id: uid(), name: d.name.trim(), weight: cond ? (parseInt(d.weight, 10) || 10) : 1, actions: [] }); persist(); closeModal();
  });
}

/* ===========================================================================
   15. ACTIONS
   =========================================================================== */
function toggleAction(gid, mid, aid) {
  const g = STATE.goals.find((x) => x.id === gid); const m = g && g.milestones.find((x) => x.id === mid); const a = m && m.actions.find((x) => x.id === aid); if (!a) return;
  const was = a.done; a.done = !a.done; persist();
  if (!was && a.done && goalProgress(g) >= 1) toast("☀ " + g.name + " — the sun's all the way up.");
}
function sendMove(gid, aid) {
  const g = STATE.goals.find((x) => x.id === gid); if (!g) return; let a = null;
  (g.milestones || []).forEach((m) => (m.actions || []).forEach((x) => { if (x.id === aid) a = x; }));
  if (!a) return;
  const due = g.type === "date" && g.targetDate ? g.targetDate : "";
  const r = pushToAdulting(a.text, due);
  if (r.ok) { a.sentToAdulting = true; persist(); toast(r.dup ? "Already in Adulting" : "Sent to Adulting → today's list"); }
  else toast(r.reason || "Couldn't reach Adulting's store.");
}
function cycleGate(gid, gtid) {
  const g = STATE.goals.find((x) => x.id === gid); const gt = g && (g.gates || []).find((x) => x.id === gtid); if (!gt) return;
  gt.status = gt.status === "no" ? "wip" : gt.status === "wip" ? "done" : "no"; persist();
}

/* ===========================================================================
   16. EVENT WIRING
   =========================================================================== */
document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id, gid = el.dataset.gid;
  if (a === "close-modal") closeModal();
  else if (a === "close-modal-backdrop" && e.target === el) closeModal();
  else if (a === "open-settings") openSettingsModal();
  else if (a === "add-goal") openAddGoalModal();
  else if (a === "open-goal") { VIEW = { name: "goal", goalId: id }; render(); }
  else if (a === "go-horizon") { VIEW = { name: "horizon" }; render(); }
  else if (a === "go-check") { VIEW = { name: "check" }; render(); }
  else if (a === "toggle-action") toggleAction(gid, el.dataset.mid, el.dataset.aid);
  else if (a === "send-move") sendMove(gid, el.dataset.aid);
  else if (a === "add-action") openAddActionModal(gid, el.dataset.mid);
  else if (a === "add-milestone") openAddMilestoneModal(gid);
  else if (a === "cycle-gate") cycleGate(gid, el.dataset.gtid);
  else if (a === "connect-google") connectGoogle();
  else if (a === "disconnect-google") { Calendar.disconnect(); toast("Disconnected"); openSettingsModal(); }
  else if (a === "sync-drive-now") syncFromDriveIfNewer({ surfaceErrors: true }).then((r) => toast(r.pulled ? "Loaded newer data from Drive" : "Synced to Drive")).catch((err) => toast(err.message));
  else if (a === "enable-notifications") enableNotifications();
  else if (a === "export-backup") exportBackup();
  else if (a === "as-toggle") { asOpen = !asOpen; renderAssistant(); }
  else if (a === "as-close") { asOpen = false; renderAssistant(); }
});

/* ===========================================================================
   17. STARTUP
   =========================================================================== */
render();
renderAssistant();
if (STATE.settings.googleClientId) {
  Calendar.init(STATE.settings.googleClientId).then(() => Calendar.ensureToken()).then((ok) => { if (ok) syncFromDriveIfNewer(); }).catch((e) => console.warn("Google init skipped:", e));
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
